[project]
name = "efi_api"
version = "0.0.1"
description = "This is the backend for the AV-EFI project."
authors = [
    { name = "Triet Doan", email = "triet.doan@gwdg.de" },
    { name = "Pranay Bhatia", email = "pranay.bhatia@stud.uni-goettingen.de" },
    { name = "Elias Oltmanns", email = "elias.oltmanns@gwdg.de" },
]
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi (>=0.110.0,<1.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "elasticsearch (>=8.15.1,<9.0.0)",
    "python-multipart (>=0.0.9,<0.1.0)",
    "httpx (>=0.25.1,<0.26.0)",
]

[tool.poetry.dependencies]
uvicorn = {extras = ["standard"], version = "^0.27.1"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

[project.scripts]
rebuild_search_index = "efi_api.helpers.indexing:rebuild_search_index"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
