[project]
name = "api"
version = "0.0.1"
description = "This is the backend for the AV-EFI project."
authors = [
    { name = "Triet Doan", email = "triet.doan@gwdg.de" },
    { name = "Pranay Bhatia", email = "pranay.bhatia@stud.uni-goettingen.de" },
    { name = "Elias Oltmanns", email = "elias.oltmanns@gwdg.de" },
]
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi (>=0.110.0,<1.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "elasticsearch (>=8.15.1,<9.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "httpx (>=0.28.1,<0.29.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "authlib (>=1.5.0,<2.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "avefi-schema @ git+https://github.com/AV-EFI/av-efi-schema.git",
    "fastapi-csrf-protect (>=1.0.3,<2.0.0)",
]

[project.scripts]
rebuild_search_index = "app.helpers.indexing:rebuild_search_index"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # FastAPI
    "FAST",
    # isort
    "I",
    # flake8-simplify
    "SIM",
    # pyupgrade
    "UP",
    # white space
    "W",
]
ignore = [
    "D100", "D101", "D102", "D103", "D104",
    "D206", "D300", "W191",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true
