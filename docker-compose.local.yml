services:
  av-efi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - EFI_API_LOGLEVEL=${EFI_API_LOGLEVEL:-DEBUG}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - './.api_config.env:/code/.api_config.env:ro'
      - './efi_api/:/code/efi_api/:ro'
    networks:
      proxy-network:
        aliases:
          - av-efi-backend

networks:
  proxy-network:
    name: proxy-network
    external: true
    # Create once: docker network create --opt mtu=1450 proxy-network
