services:
  av-efi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - EFI_API_LOGLEVEL=${EFI_API_LOGLEVEL:-DEBUG}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - './.env:/code/.env:ro'
    networks:
      proxy-network:
        aliases:
          - av-efi-backend

networks:
  proxy-network:
    name: proxy-network
    external: true
