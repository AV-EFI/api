stages:
  - test
  - trigger

gitleaks:
  stage: test
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks git --platform gitlab --verbose --redact

.base_ruff:
  stage: test
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:0.15.0-alpine
  before_script:
    - cd $CI_PROJECT_DIR
    - ruff --version

ruff check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab --output-file=code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

ruff format:
  extends: .base_ruff
  script:
    - ruff format --diff

.base_python:
  stage: test
  interruptible: true
  image:
    name: ghcr.io/astral-sh/uv:0.13.7-python3.13-trixie-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - uv sync --locked --no-python-downloads

pytest:
  extends: .base_python
  script:
    - uv run pytest -m "not postgres"

pytest-postgres:
  extends: .base_python
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_USER: avefi
    POSTGRES_DB: avefi_test
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql+asyncpg://avefi@postgres:5432/avefi_test
    TEST_DATABASE_URL: postgresql+asyncpg://avefi@postgres:5432/avefi_test
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git postgresql-client
    - uv sync --locked --no-python-downloads
    - until pg_isready -h postgres -U avefi -d avefi_test; do sleep 1; done
  script:
    - uv run alembic upgrade head
    - uv run pytest

# Tests only; deployment is handled by the separate `av-efi/api-deploy` repo.
deploy-trigger:
  stage: trigger
  trigger:
    project: av-efi/api-deploy
    branch: main
    strategy: mirror
  variables:
    TRIGGER: "api"
    TARGET_ENV: "$CI_COMMIT_BRANCH"
    API_REF: "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "testbed"'
    - if: '$CI_COMMIT_BRANCH == "production"'
