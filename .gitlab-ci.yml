stages:
  - test
  - build
  - prepare
  - release
  - deploy

variables:
  # Specify to Docker where to create the certificates. Docker
  # creates them automatically on boot, and creates
  # `/certs/client` to share between the service and job
  # container, thanks to volume mount from config.toml
  DOCKER_TLS_CERTDIR: "/certs"
  CONTAINER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME

gitleaks:
  stage: test
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks git --platform gitlab --verbose --redact

.base_ruff:
  stage: test
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:0.15.0-alpine
  before_script:
    - cd $CI_PROJECT_DIR
    - ruff --version

ruff check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab --output-file=code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

ruff format:
  extends: .base_ruff
  script:
    - ruff format --diff

.docker_common:
  image: docker.gitlab.gwdg.de/eoltman/docker-ext:${DOCKER_IMAGE_VERSION}
  services:
    - name: docker.io/library/docker:${DOCKER_IMAGE_VERSION}-dind
      alias: docker
      command: ["--mtu=1450"]
  tags:
    - docker
  before_script:
    - echo "$CI_JOB_TOKEN"
      | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

# Build a docker image when a push is made to a non-default branch.
build_docker:
  stage: build
  script:
    - docker build --pull --tag $CONTAINER_IMAGE .
    - docker push $CONTAINER_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  extends: .docker_common

prepare_job:
  stage: prepare
  rules:
    - if: >-
        $CI_COMMIT_TAG =~ /v[0-9]+\.[0-9]+\.[0-9]+$/
        && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - grep "^version *=" pyproject.toml
      | sed -e 's/^version/TAG/' >> variables.env
  artifacts:
    reports:
      dotenv: variables.env  # Use artifacts:reports:dotenv to expose the variables to other jobs

release_gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: prepare_job
      artifacts: true
  script:
    - echo 'Running release_job for $TAG'
  release:
    name: 'Release $TAG'
    description: './CHANGELOG.md'
    tag_name: '$TAG'
    ref: '$CI_COMMIT_SHA'
  rules:
    - if: >-
        $CI_COMMIT_TAG =~ /v[0-9]+\.[0-9]+\.[0-9]+$/
        && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# Build a docker image with tag as current version and latest when commits are pushed or merged to the default branch
release_docker:
  stage: release
  needs:
    - job: prepare_job
      artifacts: true
  before_script:
    - echo "Building image with tag $TAG and latest"
    - echo "$CI_JOB_TOKEN"
      | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build --pull --tag $CI_REGISTRY_IMAGE:$TAG
      --tag $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$TAG
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: >-
        $CI_COMMIT_TAG =~ /v[0-9]+\.[0-9]+\.[0-9]+$/
        && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  extends: .docker_common

.deploy:
  stage: deploy
  variables:
    ## To be set as CI/CD variables:
    #DEPLOY_USER
    #DEPLOY_PATH
  before_script:
    # Setup SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - base64 -d "$SSH_PRIVATE_KEY" | ssh-add -
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - envsubst < docker-compose.tmpl > docker-compose.yml
    - envsubst < config/config.ini.tmpl > config/config.ini
    # Create the new deployment's config directory if it doesn't exist
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "mkdir -p $DEPLOY_PATH/config"
    # Upload docker-compose.yml and config to server
    - scp docker-compose.yml config/config.ini
      $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/
    # Login to Docker registry and restart containers
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "cd $DEPLOY_PATH &&
      mv config.ini config/ &&
      echo 'Logging into registry $CI_REGISTRY' &&
      echo '$CI_JOB_TOKEN'
      | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY &&
      echo 'Pulling latest images' &&
      docker compose pull &&
      echo 'Starting containers' &&
      docker compose up -d"
  extends: .docker_common

deploy-staging:
  environment:
    name: staging
    url: https://testbed.av-efi.net/rest/v1/docs
  rules:
    - if: $CI_COMMIT_BRANCH == "testbed"
  extends: .deploy

deploy-production:
  environment:
    name: production
    url: https://www.av-efi.net/rest/v1/docs
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
  extends: .deploy
