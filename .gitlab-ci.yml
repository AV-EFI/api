stages:
  - test
  - build
  - prepare
  - release
  - deploy

variables:
  # Specify to Docker where to create the certificates. Docker
  # creates them automatically on boot, and creates
  # `/certs/client` to share between the service and job
  # container, thanks to volume mount from config.toml
  DOCKER_TLS_CERTDIR: "/certs"
  CONTAINER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME

gitleaks:
  stage: test
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks git --platform gitlab --verbose --redact

.base_ruff:
  stage: test
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:0.15.0-alpine
  before_script:
    - cd $CI_PROJECT_DIR
    - ruff --version

ruff check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab --output-file=code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

ruff format:
  extends: .base_ruff
  script:
    - ruff format --diff

.docker_common:
  image: docker.gitlab.gwdg.de/eoltman/docker-ext:${DOCKER_IMAGE_VERSION}
  services:
    - name: docker.io/library/docker:${DOCKER_IMAGE_VERSION}-dind
      alias: docker
      command: ["--mtu=1450"]
  tags:
    - docker
  before_script:
    - echo "$CI_JOB_TOKEN"
      | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

# Build a docker image when a push is made to a non-default branch.
build_docker:
  stage: build
  script:
    - docker build --pull --tag $CONTAINER_IMAGE .
    - docker push $CONTAINER_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  extends: .docker_common

prepare_job:
  stage: prepare
  rules:
    - if: >-
        $CI_COMMIT_TAG =~ /v[0-9]+\.[0-9]+\.[0-9]+$/
        && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - grep "^version *=" pyproject.toml
      | sed -e 's/^version/TAG/' >> variables.env
  artifacts:
    reports:
      dotenv: variables.env  # Use artifacts:reports:dotenv to expose the variables to other jobs

release_gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: prepare_job
      artifacts: true
  script:
    - echo 'Running release_job for $TAG'
  release:
    name: 'Release $TAG'
    description: './CHANGELOG.md'
    tag_name: '$TAG'
    ref: '$CI_COMMIT_SHA'
  rules:
    - if: >-
        $CI_COMMIT_TAG =~ /v[0-9]+\.[0-9]+\.[0-9]+$/
        && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# Build a docker image with tag as current version and latest when commits are pushed or merged to the default branch
release_docker:
  stage: release
  needs:
    - job: prepare_job
      artifacts: true
  before_script:
    - echo "Building image with tag $TAG and latest"
    - echo "$CI_JOB_TOKEN"
      | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build --pull --tag $CI_REGISTRY_IMAGE:$TAG
      --tag $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$TAG
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: >-
        $CI_COMMIT_TAG =~ /v[0-9]+\.[0-9]+\.[0-9]+$/
        && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  extends: .docker_common

# Deployments are performed by the separate `av-efi/api-deploy` repository.
# Pushing to the `testbed` or `production` branch builds/pushes the image (see
# `build_docker`) and triggers the matching downstream deployment pipeline.
.deploy_trigger_base:
  stage: deploy
  trigger:
    project: av-efi/api-deploy
    branch: main
    strategy: depend
  needs:
    - job: build_docker
  variables:
    IMAGE_NAME: "$CI_REGISTRY_IMAGE"
    TRIGGER: "api"

deploy-trigger-testbed:
  extends: .deploy_trigger_base
  variables:
    TARGET_ENV: "testbed"
    IMAGE_TAG: "testbed"
  rules:
    - if: '$CI_COMMIT_BRANCH == "testbed"'

deploy-trigger-production:
  extends: .deploy_trigger_base
  variables:
    TARGET_ENV: "production"
    IMAGE_TAG: "production"
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
