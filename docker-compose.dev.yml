services:
  av-efi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - EFI_API_LOGLEVEL=${EFI_API_LOGLEVEL:-DEBUG}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - './config:/code/config:ro'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      proxy-network:
        aliases:
          - av-efi-backend
      db-network:

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/code/.venv/bin/alembic", "upgrade", "head"]
    restart: "no"
    volumes:
      - './config:/code/config:ro'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/code/.venv/bin/python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      - EFI_API_LOGLEVEL=${EFI_API_LOGLEVEL:-INFO}
    volumes:
      - './config:/code/config:ro'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - db-network

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-avefi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-avefi}
      - POSTGRES_DB=${POSTGRES_DB:-avefi}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avefi} -d ${POSTGRES_DB:-avefi}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - db-network

volumes:
  postgres:

networks:
  proxy-network:
    name: proxy-network
    external: true
    # Create once: docker network create --opt mtu=1450 proxy-network
  db-network:
    name: db-network
    external: true
    # Create once: docker network create --opt mtu=1450 --internal db-network
