services:
  efi-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.gitlab.gwdg.de/av-efi/api:latest
    command: ""
    entrypoint: /code/.venv/bin/efi-agent
    volumes:
      - .:/data:Z
      - ./config:/data/config:ro
    working_dir: /data
    networks:
      - proxy-network

networks:
  proxy-network:
    name: proxy-network
    external: true
    # Create once: docker network create --opt mtu=1450 proxy-network
