services:
  av-efi-backend:
    image: ${API_IMAGE:-docker.gitlab.gwdg.de/av-efi/api}
    restart: unless-stopped
    environment:
      - EFI_API_LOGLEVEL=${EFI_API_LOGLEVEL:-WARNING}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - './.api_config.env:/code/.api_config.env:ro'
    networks:
      proxy-network:
        aliases:
          - av-efi-backend
      db-network:

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-avefi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-avefi}
      - POSTGRES_DB=${POSTGRES_DB:-avefi}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-network

volumes:
  postgres-data:

networks:
  proxy-network:
    name: proxy-network
    external: true
    # Create once: docker network create --opt mtu=1450 proxy-network
  db-network:
    name: db-network
    external: true
    # Create once: docker network create --opt mtu=1450 --internal db-network
